{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4 mt-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1 text-center" style="color:#2f6f4f;">RNMS Login</h4>
        <p class="text-center text-muted small mb-4">नगर पंचायत रतसर कलां — वित्त एवं निर्माण कार्य प्रबंधन पोर्टल</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn w-100 text-white" style="background:#2f6f4f;">लॉगिन करें</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
